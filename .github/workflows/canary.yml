# Weekly canary on the floating runner label (platform/automation): sees an
# upcoming runner image change before it reaches the pinned jobs.
name: canary

on:
  schedule:
    - cron: '41 5 * * 3'
  workflow_dispatch:

permissions:
  contents: write  # record the run on the health record

concurrency:
  group: health-record-canary
  cancel-in-progress: false

jobs:
  floating-label:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the Node floor on the runner's own Node
        run: node verify/node-floor.mjs
      - name: Tests
        run: npm test
      - name: Record the run
        run: |
          node pipeline/record-run.mjs canary
          git config user.name "gridprims pipeline"
          git config user.email "pipeline@gridprims.com"
          git add data/health
          git diff --cached --quiet || git commit -m "chore(data): canary run"
          git pull --rebase && git push
