# The browser suite in Chrome and Firefox (docs/decisions-day-one.md §6). It
# takes a quarter of an hour, so it runs on pull requests, nightly against main,
# and on demand, not on every push. One Node version: these tests exercise the
# browsers, and the unit suite already covers both supported Node versions.
name: browser

on:
  pull_request:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Assert the Node floor
        run: node verify/node-floor.mjs
      - name: Browser gates
        run: npm run test:browser
