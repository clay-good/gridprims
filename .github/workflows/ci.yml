# Tests and gates on every push and pull request (docs/decisions-day-one.md §6).
# Every step is git, node, or a script in this repository. Actions are GitHub's
# own, pinned to full commit SHAs. No install step: there is nothing to install.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24.12.0', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Assert the Node floor
        run: node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a<24||(a===24&&b<12)) { console.error('Node '+process.versions.node+' is below the 24.12 floor'); process.exit(1) }"
      - name: Tests
        run: npm test
      - name: Gates
        run: npm run check

  safari:
    # Safari runs the smaller suite through the built-in safaridriver; enabling
    # remote automation needs sudo, which the hosted macOS runner allows.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Enable Safari automation
        run: sudo safaridriver --enable
      - name: Parser suite in Safari
        run: node --test verify/tests/browser/parsers.test.mjs
        env:
          GRIDPRIMS_SAFARI_TESTS: '1'
