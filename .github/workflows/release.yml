# Release on a version tag (platform/privacy-and-security, "Supply-chain
# integrity"): rebuild from the tag, then publish digests of every deployed
# file, the MCP archive, and the SBOM as release assets.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Assert the Node floor
        run: node verify/node-floor.mjs
      - name: Tests and gates
        run: npm test && npm run check
      - name: Build and write release files
        run: node site/build.mjs && node pipeline/release.mjs "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - name: Publish the release
        run: node pipeline/publish-release.mjs "$TAG" release
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
