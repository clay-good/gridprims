# Monthly value log (plan-launch-and-value-proof D3). Writes this month's
# entry to docs/value-log.md from what the pipeline already holds; no
# person's step, and nothing estimated.
name: value-log

on:
  schedule:
    - cron: '7 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: value-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Assert the Node floor
        run: node verify/node-floor.mjs
      - name: Write this month's entry
        run: node pipeline/value-log.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish
        run: |
          git config user.name "gridprims pipeline"
          git config user.email "pipeline@gridprims.com"
          git add docs/value-log.md
          git diff --cached --quiet || git commit -m "docs(value-log): monthly entry"
          git pull --rebase && git push
