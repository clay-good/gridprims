# Weekly GO 95 watch (add-overhead-line-checks D3). Compares the CPUC's table
# pages with the stored captures and records what differs on the health
# record. Blocks nothing and waits on nobody.
name: go95-watch

on:
  schedule:
    - cron: '31 7 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go95-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Assert the Node floor
        run: node verify/node-floor.mjs
      - name: Compare the GO 95 tables with the stored captures
        run: node pipeline/go95-watch.mjs
      - name: Publish
        run: |
          git config user.name "gridprims pipeline"
          git config user.email "pipeline@gridprims.com"
          git add data/health
          git diff --cached --quiet || git commit -m "chore(data): weekly GO 95 watch"
          git pull --rebase && git push
