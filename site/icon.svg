<!-- The mark is a demand profile: a stepped load curve with its peak flagged in
     the signal color, the one thing every gridprims tool looks for in a meter
     file. Square caps and mitred joins keep the steps legible at 16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#222624"/><g fill="none" stroke-width="70" stroke-linecap="square" stroke-linejoin="miter"><path d="M105 360H200V160" stroke="#e9ebe8"/><path d="M312 160V290H407" stroke="#e9ebe8"/><path d="M200 160H312" stroke="#ff7043"/></g></svg>
